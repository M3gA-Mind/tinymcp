name: Live registry acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Allow bubblewrap user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test -p tinymcp --test live_official_registry
        env:
          TINYMCP_LIVE_REGISTRY: "1"
