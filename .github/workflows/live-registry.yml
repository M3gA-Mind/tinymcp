name: Live registry acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: cargo test -p tinymcp --test live_official_registry
        env:
          TINYMCP_LIVE_REGISTRY: "1"
