name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@62c8ae0468f3882b75947d5cba9687e609ce1fed # pin the shared required-check contract
    with:
      coverage-script: scripts/check-coverage.sh
      module-e2e-script: scripts/test-e2e.sh
      feature-test-script: scripts/test-features.sh
